# NVIDIA GPU override. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# or simply: python llamacag.py start --gpu
# Requires the NVIDIA Container Toolkit (bundled with Docker Desktop on Windows).
# For Intel/AMD GPUs see docker-compose.vulkan.yml instead.

services:
  llama-server:
    image: ${LLAMA_IMAGE_CUDA:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    # command is replaced wholesale by this override, so it repeats the base
    # arguments and adds --gpu-layers.
    command: >
      -hf ${LLAMA_MODEL:-google/gemma-4-12B-it-qat-q4_0-gguf}
      --ctx-size ${LLAMA_CTX_SIZE:-65536}
      --parallel ${CAG_SLOTS:-1}
      --cache-type-k ${LLAMA_CACHE_TYPE_KV:-q8_0}
      --cache-type-v ${LLAMA_CACHE_TYPE_KV:-q8_0}
      --slot-save-path /caches
      --host 0.0.0.0
      --port 8080
      --threads ${LLAMA_THREADS:--1}
      --gpu-layers ${LLAMA_GPU_LAYERS:-999}
      ${LLAMA_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
