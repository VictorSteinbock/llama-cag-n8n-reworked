<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <radialGradient id="u4Cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#0F172A"/>
  <ellipse cx="700" cy="270" rx="420" ry="180" fill="url(#u4Cyan)"/>

  <!-- header -->
  <text x="60" y="52" font-size="13" font-weight="700" fill="#F59E0B" letter-spacing="3">USE CASE 4 OF 5 &#183; REVIEW &amp; COMPLIANCE</text>
  <text x="60" y="90" font-size="30" font-weight="700" fill="#E2E8F0">Audit a draft's claims against the source &#8212; with a known miss rate</text>
  <text x="61" y="117" font-size="15" fill="#94A3B8">Sweep every claim through the oracle in one call; measure the oracle on your canon before you trust it.</text>

  <!-- source: the draft -->
  <rect x="60" y="212" width="200" height="120" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="160" y="244" font-size="11" fill="#64748B" text-anchor="middle">THE DRAFT</text>
  <text x="160" y="266" font-size="13.5" font-weight="700" fill="#E2E8F0" text-anchor="middle">report &#183; answer &#183;</text>
  <text x="160" y="285" font-size="13.5" font-weight="700" fill="#E2E8F0" text-anchor="middle">memory dump</text>
  <text x="160" y="308" font-size="11" fill="#94A3B8" text-anchor="middle">split into claims</text>

  <!-- fan-out arrows -->
  <path d="M260 250 C 290 232, 310 222, 330 216" fill="none" stroke="#475569" stroke-width="1.75"/>
  <path d="M333 215 L324 212 L326 221 Z" fill="#475569"/>
  <line x1="260" y1="272" x2="330" y2="272" stroke="#475569" stroke-width="1.75"/>
  <path d="M332 272 L323 268 L323 276 Z" fill="#475569"/>
  <path d="M260 294 C 290 312, 310 322, 330 328" fill="none" stroke="#475569" stroke-width="1.75"/>
  <path d="M333 329 L326 323 L324 332 Z" fill="#475569"/>

  <!-- claim rows: claim chip -> verdict chip -->
  <!-- row 1 -->
  <rect x="336" y="186" width="330" height="58" rx="10" fill="#0E1626" stroke="#334155" stroke-width="1.25"/>
  <text x="352" y="210" font-size="10.5" fill="#64748B">CLAIM</text>
  <text x="352" y="230" font-size="12.5" fill="#E2E8F0">&#171;The peak current limit is 12 A.&#187;</text>
  <line x1="666" y1="215" x2="708" y2="215" stroke="#34D399" stroke-width="2"/>
  <path d="M710 215 L701 211 L701 219 Z" fill="#34D399"/>
  <rect x="712" y="186" width="428" height="58" rx="10" fill="#12261E" stroke="#34D399" stroke-width="1.5"/>
  <text x="728" y="210" font-size="12.5" font-weight="700" fill="#34D399">supported &#183; quote byte-checked &#10003;</text>
  <text x="728" y="230" font-size="11" fill="#A9D9C6">quote_grounded: true &#183; match: exact</text>

  <!-- row 2 -->
  <rect x="336" y="258" width="330" height="58" rx="10" fill="#0E1626" stroke="#334155" stroke-width="1.25"/>
  <text x="352" y="282" font-size="10.5" fill="#64748B">CLAIM</text>
  <text x="352" y="302" font-size="12.5" fill="#E2E8F0">&#171;Widgets are refundable within 30 days.&#187;</text>
  <line x1="666" y1="287" x2="708" y2="287" stroke="#F87171" stroke-width="2"/>
  <path d="M710 287 L701 283 L701 291 Z" fill="#F87171"/>
  <rect x="712" y="258" width="428" height="58" rx="10" fill="#1B1416" stroke="#F87171" stroke-width="1.5"/>
  <text x="728" y="282" font-size="12.5" font-weight="700" fill="#F87171">contradicted &#183; with the passage that rules</text>
  <text x="728" y="302" font-size="11" fill="#CBB6B7">conditions: &#171;only if defective&#187; &#183; quote_grounded: true</text>

  <!-- row 3 -->
  <rect x="336" y="330" width="330" height="58" rx="10" fill="#0E1626" stroke="#334155" stroke-width="1.25"/>
  <text x="352" y="354" font-size="10.5" fill="#64748B">CLAIM</text>
  <text x="352" y="374" font-size="12.5" fill="#E2E8F0">&#171;It ships with a carry case.&#187;</text>
  <line x1="666" y1="359" x2="708" y2="359" stroke="#64748B" stroke-width="2"/>
  <path d="M710 359 L701 355 L701 363 Z" fill="#64748B"/>
  <rect x="712" y="330" width="428" height="58" rx="10" fill="#141A26" stroke="#64748B" stroke-width="1.5"/>
  <text x="728" y="354" font-size="12.5" font-weight="700" fill="#94A3B8">absent &#8212; the canon is silent &#8594; human review</text>
  <text x="728" y="374" font-size="11" fill="#64748B">quote_grounded: null &#183; never auto-trusted</text>

  <!-- calibrate strip -->
  <rect x="60" y="410" width="1080" height="52" rx="10" fill="#14202E" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="84" y="432" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="1.5">FIRST, CALIBRATE</text>
  <text x="84" y="450" font-size="12" fill="#94A3B8">POST /documents/{id}/calibrate runs your known-answer battery at temp 0 &#8594; accuracy = the miss rate to expect from THIS canon under THIS model</text>

  <!-- bottom band -->
  <rect x="60" y="478" width="352" height="150" rx="12" fill="#0E1626" stroke="#1E293B" stroke-width="1.5"/>
  <text x="82" y="506" font-size="12" font-weight="700" fill="#34D399" letter-spacing="2">WHY IT HOLDS</text>
  <text x="82" y="530" font-size="12.5" fill="#94A3B8">&#183; every verdict must cite its passage, and</text>
  <text x="82" y="549" font-size="12.5" fill="#94A3B8">&#160;&#160;the quote is byte-checked mechanically</text>
  <text x="82" y="568" font-size="12.5" fill="#94A3B8">&#183; one webhook call gates a whole list;</text>
  <text x="82" y="587" font-size="12.5" fill="#94A3B8">&#160;&#160;one bad claim doesn't abort the rest</text>

  <rect x="424" y="478" width="352" height="150" rx="12" fill="#0E1626" stroke="#1E293B" stroke-width="1.5"/>
  <text x="446" y="506" font-size="12" font-weight="700" fill="#F87171" letter-spacing="2">THE HONEST LIMIT</text>
  <text x="446" y="530" font-size="12.5" fill="#94A3B8">&#183; facts can be true and the conclusion still</text>
  <text x="446" y="549" font-size="12.5" fill="#94A3B8">&#160;&#160;wrong &#8212; gate whole answers with page 2</text>
  <text x="446" y="568" font-size="12.5" fill="#94A3B8">&#183; entailment is still the model's judgment</text>
  <text x="446" y="587" font-size="12.5" fill="#94A3B8">&#160;&#160;&#8212; reproducible, not infallible</text>

  <rect x="788" y="478" width="352" height="150" rx="12" fill="#0E1626" stroke="#1E293B" stroke-width="1.5"/>
  <text x="810" y="506" font-size="12" font-weight="700" fill="#22D3EE" letter-spacing="2">WHAT YOU NEED</text>
  <text x="810" y="530" font-size="12.5" fill="#94A3B8">&#183; the source document ingested once</text>
  <text x="810" y="549" font-size="12.5" fill="#94A3B8">&#183; a claims list (the bundled verification</text>
  <text x="810" y="568" font-size="12.5" fill="#94A3B8">&#160;&#160;workflow takes it as one POST)</text>
  <text x="810" y="587" font-size="12.5" fill="#94A3B8">&#183; optionally: a known-answer battery</text>

  <!-- footer -->
  <text x="60" y="662" font-size="11.5" fill="#475569">docs/USE-CASES.md &#8212; the five-page tour</text>
  <text x="1140" y="662" font-size="12" fill="#64748B" text-anchor="end">llama-cag &#183; read once, ask forever &#183; 4 / 5</text>
</svg>
