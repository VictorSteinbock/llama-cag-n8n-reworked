<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <radialGradient id="heroGlowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="340" fill="#0F172A"/>
  <ellipse cx="620" cy="150" rx="360" ry="200" fill="url(#heroGlowAmber)"/>
  <ellipse cx="1010" cy="150" rx="240" ry="180" fill="url(#heroGlowCyan)"/>

  <!-- title + tagline -->
  <text x="60" y="86" font-size="52" font-weight="700" fill="#E2E8F0" letter-spacing="-0.5">llama-cag-n8n</text>
  <text x="62" y="128" font-size="27" font-weight="600" fill="#F59E0B">Read once. <tspan fill="#34D399">Ask forever.</tspan></text>

  <!-- ===== mini-pipeline ===== -->
  <!-- document icon -->
  <g>
    <rect x="60" y="182" width="94" height="112" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <path d="M126 182 v22 a4 4 0 0 0 4 4 h20" fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M150 208 L126 182 v22 a4 4 0 0 0 4 4 z" fill="#0F172A"/>
    <line x1="78" y1="232" x2="136" y2="232" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="250" x2="136" y2="250" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="268" x2="118" y2="268" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="107" y="322" font-size="15" fill="#94A3B8" text-anchor="middle">document</text>
  </g>

  <!-- arrow doc -> cache -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="168" y1="238" x2="214" y2="238" stroke-linecap="round"/>
    <path d="M206 231 L216 238 L206 245" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- amber cache chip with flame -->
  <g>
    <rect x="230" y="188" width="238" height="100" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <!-- flame -->
    <g transform="translate(266 238)">
      <path d="M0 26 C -20 12 -14 -8 -2 -20 C -3 -6 8 -8 6 -20 C 20 -8 22 10 6 24 C 14 12 6 4 2 8 C 6 16 -2 20 -6 14 C -8 20 -2 26 0 26 Z"
            fill="#F59E0B"/>
      <path d="M0 22 C -10 12 -8 0 0 -8 C -1 2 6 0 4 -8 C 12 0 10 12 2 20 C 6 12 2 8 0 10 C 2 14 -2 18 0 22 Z"
            fill="#FBBF24"/>
    </g>
    <text x="300" y="232" font-size="19" font-weight="700" fill="#F59E0B">KV cache</text>
    <text x="300" y="258" font-size="16" fill="#94A3B8">on disk</text>
  </g>

  <!-- arrow cache -> answers -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="482" y1="238" x2="528" y2="238" stroke-linecap="round"/>
    <path d="M520 231 L530 238 L520 245" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- three fast green answer chips -->
  <g>
    <rect x="544" y="192" width="176" height="30" rx="15" fill="#1E293B" stroke="#34D399" stroke-width="1.75"/>
    <circle cx="565" cy="207" r="5" fill="#34D399"/>
    <text x="580" y="212" font-size="15" fill="#E2E8F0">answer · fast</text>

    <rect x="544" y="230" width="176" height="30" rx="15" fill="#1E293B" stroke="#34D399" stroke-width="1.75"/>
    <circle cx="565" cy="245" r="5" fill="#34D399"/>
    <text x="580" y="250" font-size="15" fill="#E2E8F0">answer · fast</text>

    <rect x="544" y="268" width="176" height="30" rx="15" fill="#1E293B" stroke="#34D399" stroke-width="1.75"/>
    <circle cx="565" cy="283" r="5" fill="#34D399"/>
    <text x="580" y="288" font-size="15" fill="#E2E8F0">answer · fast</text>
  </g>

  <!-- explanatory line beside pipeline -->
  <text x="770" y="212" font-size="17" font-weight="600" fill="#E2E8F0">The model reads the whole document once.</text>
  <text x="770" y="238" font-size="17" fill="#94A3B8">Its memory is saved to disk, then every</text>
  <text x="770" y="262" font-size="17" fill="#94A3B8">question restores it — only your question</text>
  <text x="770" y="286" font-size="17" fill="#94A3B8">and the answer are ever computed again.</text>

  <!-- ===== bottom capability chips ===== -->
  <g font-size="15" font-weight="600">
    <!-- 100% local -->
    <rect x="60" y="306" width="118" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="119" y="323" fill="#94A3B8" text-anchor="middle">100% local</text>
    <!-- Docker, 2 commands -->
    <rect x="190" y="306" width="176" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="278" y="323" fill="#94A3B8" text-anchor="middle">Docker · 2 commands</text>
    <!-- n8n automation -->
    <rect x="378" y="306" width="150" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="453" y="323" fill="#94A3B8" text-anchor="middle">n8n automation</text>
    <!-- llama.cpp engine -->
    <rect x="540" y="306" width="156" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="618" y="323" fill="#94A3B8" text-anchor="middle">llama.cpp engine</text>
    <!-- MIT -->
    <rect x="708" y="306" width="66" height="26" rx="13" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
    <text x="741" y="323" fill="#34D399" text-anchor="middle">MIT</text>
  </g>
</svg>
