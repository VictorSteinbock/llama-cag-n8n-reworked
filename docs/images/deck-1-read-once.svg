<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>llama-cag-n8n pitch deck, page 1 of 3: Read once. Ask forever. Why the stack exists, the parts it is made of, a sample token receipt, and the honest lane.</title>
  <style>
    .sans { font-family: "Segoe UI", "Segoe UI Variable Text", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
    .ink { fill: #1F2A24; } .muted { fill: #5B665F; } .soft { fill: #4A554E; }
    .green { fill: #1E6B4F; }
    .hair { stroke: #D9DDD6; stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="1600" height="1000" fill="#F2F3EF"/>

  <!-- folio -->
  <text class="mono muted" x="84" y="58" font-size="12" letter-spacing="2.2">LLAMA-CAG-N8N · A SELF-HOSTED DOCUMENT-MEMORY &amp; VERIFICATION STACK</text>
  <text class="mono muted" x="1516" y="58" font-size="12" letter-spacing="2.2" text-anchor="end">01 / 03</text>
  <line class="hair" x1="84" y1="78" x2="1516" y2="78"/>

  <!-- headline -->
  <text class="mono green" x="84" y="156" font-size="14" letter-spacing="3.4" font-weight="600">WHY I BUILT THIS</text>
  <text class="sans ink" x="82" y="234" font-size="66" font-weight="700" letter-spacing="-0.5">Read once. Ask forever.</text>
  <text class="sans soft" x="84" y="292" font-size="23">A local model normally re-reads the whole document on every</text>
  <text class="sans soft" x="84" y="326" font-size="23">question — minutes of compute to answer one line. This stack reads</text>
  <text class="sans soft" x="84" y="360" font-size="23">it once, saves the model's state to disk, and never reads it again.</text>

  <!-- left column: the itch -->
  <text class="sans ink" x="84" y="440" font-size="19" font-weight="700">The itch, honestly</text>
  <text class="sans" fill="#3D4842" x="84" y="472" font-size="17.5">I kept asking one manual the same kinds of questions, and my</text>
  <text class="sans" fill="#3D4842" x="84" y="500" font-size="17.5">CPU paid the full read every single time. Prompt caches that</text>
  <text class="sans" fill="#3D4842" x="84" y="528" font-size="17.5">survive restarts existed in papers and cloud APIs — but the</text>
  <text class="sans" fill="#3D4842" x="84" y="556" font-size="17.5">mainstream self-hosted tools don't ship one end to end. So I</text>
  <text class="sans" fill="#3D4842" x="84" y="584" font-size="17.5">wired this from parts that already work, and wrote down what</text>
  <text class="sans" fill="#3D4842" x="84" y="612" font-size="17.5">I learned along the way.</text>

  <!-- parts chips -->
  <text class="mono muted" x="84" y="642" font-size="12" letter-spacing="2.2">THE PARTS — ALL DOCKER, ALL ON YOUR MACHINE</text>
  <g>
    <rect x="84" y="658" width="238" height="38" rx="19" fill="#FFFFFF" stroke="#D9DDD6"/>
    <text class="mono ink" x="203" y="682" font-size="14" text-anchor="middle">llama.cpp · llama-server</text>
    <rect x="334" y="658" width="190" height="38" rx="19" fill="#FFFFFF" stroke="#D9DDD6"/>
    <text class="mono ink" x="429" y="682" font-size="14" text-anchor="middle">FastAPI orchestrator</text>
    <rect x="536" y="658" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#D9DDD6"/>
    <text class="mono ink" x="611" y="682" font-size="14" text-anchor="middle">n8n automation</text>
    <rect x="698" y="658" width="130" height="38" rx="19" fill="#FFFFFF" stroke="#D9DDD6"/>
    <text class="mono ink" x="763" y="682" font-size="14" text-anchor="middle">Postgres 17</text>
  </g>

  <!-- receipt card -->
  <g>
    <rect x="940" y="150" width="576" height="524" rx="10" fill="#FFFFFF" stroke="#D9DDD6"/>
    <text class="mono muted" x="976" y="198" font-size="13" letter-spacing="2.6">SAMPLE RECEIPT — EVERY ANSWER SHIPS ONE</text>
    <line x1="976" y1="216" x2="1480" y2="216" stroke="#C9CFC8" stroke-width="1.2" stroke-dasharray="3 5"/>

    <text class="mono ink" x="976" y="266" font-size="18">document</text>
    <line x1="1150" y1="261" x2="1300" y2="261" stroke="#B9C0BA" stroke-width="1.5" stroke-dasharray="2 6"/>
    <text class="mono ink" x="1480" y="266" font-size="18" text-anchor="end">vendor-spec.md</text>

    <text class="mono ink" x="976" y="312" font-size="18">prompt tokens</text>
    <line x1="1150" y1="307" x2="1390" y2="307" stroke="#B9C0BA" stroke-width="1.5" stroke-dasharray="2 6"/>
    <text class="mono ink" x="1480" y="312" font-size="18" text-anchor="end">41,772</text>

    <text class="mono ink" x="976" y="358" font-size="18">read from cache</text>
    <line x1="1150" y1="353" x2="1390" y2="353" stroke="#B9C0BA" stroke-width="1.5" stroke-dasharray="2 6"/>
    <text class="mono ink" x="1480" y="358" font-size="18" text-anchor="end">41,734</text>

    <text class="mono green" x="976" y="410" font-size="21" font-weight="700">evaluated now</text>
    <line x1="1170" y1="404" x2="1420" y2="404" stroke="#1E6B4F" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.45"/>
    <text class="mono green" x="1480" y="410" font-size="24" font-weight="700" text-anchor="end">38</text>

    <text class="mono ink" x="976" y="458" font-size="18">time to answer</text>
    <line x1="1150" y1="453" x2="1390" y2="453" stroke="#B9C0BA" stroke-width="1.5" stroke-dasharray="2 6"/>
    <text class="mono ink" x="1480" y="458" font-size="18" text-anchor="end">590 ms</text>

    <text class="mono ink" x="976" y="504" font-size="18">survives reboot</text>
    <line x1="1150" y1="499" x2="1410" y2="499" stroke="#B9C0BA" stroke-width="1.5" stroke-dasharray="2 6"/>
    <text class="mono ink" x="1480" y="504" font-size="18" text-anchor="end">yes</text>

    <line x1="976" y1="536" x2="1480" y2="536" stroke="#C9CFC8" stroke-width="1.2" stroke-dasharray="3 5"/>
    <text class="sans muted" x="976" y="570" font-size="14.5">The gap between 41,772 and 38 is the whole point —</text>
    <text class="sans muted" x="976" y="592" font-size="14.5">and it's printed on every single answer.</text>
  </g>

  <!-- honest lane strip -->
  <line class="hair" x1="84" y1="722" x2="1516" y2="722"/>
  <text class="mono green" x="84" y="754" font-size="13" letter-spacing="2.6" font-weight="600">THE HONEST LANE</text>
  <text class="mono muted" x="1516" y="754" font-size="13" text-anchor="end">fits 16 GB RAM · default model: Gemma 4 12B (QAT)</text>
  <text class="sans" fill="#3D4842" x="84" y="788" font-size="18">Built for a handful of dense documents you ask again and again — a manual, a spec, a contract.</text>
  <text class="sans" fill="#3D4842" x="84" y="817" font-size="18">Thousands of documents? That's retrieval territory; use a RAG tool. A document too big for the</text>
  <text class="sans" fill="#3D4842" x="84" y="846" font-size="18">context window? It refuses politely and tells you the numbers. This does one narrow thing well.</text>
  <line class="hair" x1="84" y1="884" x2="1516" y2="884"/>

  <!-- footer -->
  <text class="mono muted" x="84" y="952" font-size="12.5">github.com/VictorSteinbock/llama-cag-n8n-reworked</text>
  <text class="mono muted" x="1516" y="952" font-size="12.5" text-anchor="end">MIT · offline after one model download · binds to 127.0.0.1</text>
</svg>
