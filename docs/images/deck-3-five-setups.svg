<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>llama-cag-n8n pitch deck, page 3 of 3: five setups that ship today — the spec sidecar, the answer gate, the agent memory gate, the claim audit, the private reference desk — and a modest closing note.</title>
  <style>
    .sans { font-family: "Segoe UI", "Segoe UI Variable Text", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
    .ink { fill: #1F2A24; } .muted { fill: #5B665F; } .soft { fill: #3D4842; }
    .green { fill: #1E6B4F; }
    .hair { stroke: #D9DDD6; stroke-width: 1; }
    .tagbox { fill: #FFFFFF; stroke: #D9DDD6; }
  </style>

  <rect x="0" y="0" width="1600" height="1000" fill="#F2F3EF"/>

  <!-- folio -->
  <text class="mono muted" x="84" y="58" font-size="12" letter-spacing="2.2">LLAMA-CAG-N8N · A SELF-HOSTED DOCUMENT-MEMORY &amp; VERIFICATION STACK</text>
  <text class="mono muted" x="1516" y="58" font-size="12" letter-spacing="2.2" text-anchor="end">03 / 03</text>
  <line class="hair" x1="84" y1="78" x2="1516" y2="78"/>

  <!-- headline -->
  <text class="mono green" x="84" y="148" font-size="14" letter-spacing="3.4" font-weight="600">WHAT IT'S FOR</text>
  <text class="sans ink" x="82" y="216" font-size="50" font-weight="700" letter-spacing="-0.4">Five setups that ship today.</text>
  <text class="sans soft" x="84" y="258" font-size="20">Everything below is in the repo now — wired, tested, documented. Nothing here is roadmap.</text>

  <!-- ledger rows -->
  <line class="hair" x1="84" y1="296" x2="1516" y2="296"/>
  <text class="mono green" x="84" y="352" font-size="16" font-weight="600">01</text>
  <text class="sans ink" x="150" y="336" font-size="21" font-weight="700">The spec sidecar</text>
  <text class="sans muted" x="150" y="364" font-size="16">Your coding agent consults a pinned vendor spec over MCP — the spec never occupies the paid context window.</text>
  <rect class="tagbox" x="1266" y="322" width="250" height="34" rx="17"/>
  <text class="mono muted" x="1391" y="344" font-size="13" text-anchor="middle">your RAM holds the spec</text>

  <line class="hair" x1="84" y1="386" x2="1516" y2="386"/>
  <text class="mono green" x="84" y="442" font-size="16" font-weight="600">02</text>
  <text class="sans ink" x="150" y="426" font-size="21" font-weight="700">The answer gate</text>
  <text class="sans muted" x="150" y="454" font-size="16">A support bot's draft is checked against the policy document before it ships; ungrounded answers go to a person.</text>
  <rect class="tagbox" x="1266" y="412" width="250" height="34" rx="17"/>
  <text class="mono muted" x="1391" y="434" font-size="13" text-anchor="middle">checked before it ships</text>

  <line class="hair" x1="84" y1="476" x2="1516" y2="476"/>
  <text class="mono green" x="84" y="532" font-size="16" font-weight="600">03</text>
  <text class="sans ink" x="150" y="516" font-size="21" font-weight="700">The agent memory gate</text>
  <text class="sans muted" x="150" y="544" font-size="16">A long-lived agent's new "facts" are ruled on before they become memories — one hallucination can't compound.</text>
  <rect class="tagbox" x="1236" y="502" width="280" height="34" rx="17"/>
  <text class="mono muted" x="1376" y="524" font-size="13" text-anchor="middle">ruled on before remembered</text>

  <line class="hair" x1="84" y1="566" x2="1516" y2="566"/>
  <text class="mono green" x="84" y="622" font-size="16" font-weight="600">04</text>
  <text class="sans ink" x="150" y="606" font-size="21" font-weight="700">The claim audit</text>
  <text class="sans muted" x="150" y="634" font-size="16">Every claim in a draft, report or filing is swept against the source in one call — with a measured miss rate.</text>
  <rect class="tagbox" x="1246" y="592" width="270" height="34" rx="17"/>
  <text class="mono muted" x="1381" y="614" font-size="13" text-anchor="middle">batch fact-check, measured</text>

  <line class="hair" x1="84" y1="656" x2="1516" y2="656"/>
  <text class="mono green" x="84" y="712" font-size="16" font-weight="600">05</text>
  <text class="sans ink" x="150" y="696" font-size="21" font-weight="700">The private reference desk</text>
  <text class="sans muted" x="150" y="724" font-size="16">One person, one dense binder: ask the manual instead of re-reading it. Nothing leaves the machine.</text>
  <rect class="tagbox" x="1296" y="682" width="220" height="34" rx="17"/>
  <text class="mono muted" x="1406" y="704" font-size="13" text-anchor="middle">ask the manual</text>

  <line class="hair" x1="84" y1="746" x2="1516" y2="746"/>

  <!-- closing -->
  <text class="mono green" x="84" y="800" font-size="13" letter-spacing="2.6" font-weight="600">WHY I THINK IT HELPS</text>
  <text class="sans soft" x="84" y="834" font-size="18">If your problem is "many questions, one steady document", this should save you real time and give</text>
  <text class="sans soft" x="84" y="863" font-size="18">you answers you can check. If it isn't, it won't — the README says who shouldn't use it, too.</text>
  <text class="sans soft" x="84" y="892" font-size="18">It's early, it's a one-person project, and feedback is very welcome.</text>

  <text class="mono muted" x="1516" y="800" font-size="13" text-anchor="end" letter-spacing="1.6">DOCS · 60-SECOND DEMO · SETUP GUIDE</text>
  <text class="mono ink" x="1516" y="834" font-size="16" font-weight="700" text-anchor="end">github.com/VictorSteinbock/</text>
  <text class="mono ink" x="1516" y="860" font-size="16" font-weight="700" text-anchor="end">llama-cag-n8n-reworked</text>

  <!-- footer -->
  <text class="mono muted" x="84" y="952" font-size="12.5">github.com/VictorSteinbock/llama-cag-n8n-reworked</text>
  <text class="mono muted" x="1516" y="952" font-size="12.5" text-anchor="end">MIT · offline after one model download · binds to 127.0.0.1</text>
</svg>
