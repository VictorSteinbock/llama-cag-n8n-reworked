<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>llama-cag-n8n pitch deck, page 2 of 3: the logic. The cache is the speed (warm once, ask cheap, survives reboots); the check is the trust (verdict plus quote, then a plain string search that catches fabricated citations). Honest limits stated.</title>
  <style>
    .sans { font-family: "Segoe UI", "Segoe UI Variable Text", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
    .ink { fill: #1F2A24; } .muted { fill: #5B665F; } .soft { fill: #3D4842; }
    .green { fill: #1E6B4F; }
    .hair { stroke: #D9DDD6; stroke-width: 1; }
    .card { fill: #FFFFFF; stroke: #D9DDD6; }
  </style>

  <rect x="0" y="0" width="1600" height="1000" fill="#F2F3EF"/>

  <!-- folio -->
  <text class="mono muted" x="84" y="58" font-size="12" letter-spacing="2.2">LLAMA-CAG-N8N · A SELF-HOSTED DOCUMENT-MEMORY &amp; VERIFICATION STACK</text>
  <text class="mono muted" x="1516" y="58" font-size="12" letter-spacing="2.2" text-anchor="end">02 / 03</text>
  <line class="hair" x1="84" y1="78" x2="1516" y2="78"/>

  <!-- headline -->
  <text class="mono green" x="84" y="148" font-size="14" letter-spacing="3.4" font-weight="600">THE LOGIC</text>
  <text class="sans ink" x="82" y="212" font-size="48" font-weight="700" letter-spacing="-0.4">One read, saved to disk —</text>
  <text class="sans ink" x="82" y="268" font-size="48" font-weight="700" letter-spacing="-0.4">then every answer shows its work.</text>

  <!-- band A: the cache -->
  <text class="mono muted" x="84" y="336" font-size="13" letter-spacing="2.6">A · THE CACHE — WHERE THE SPEED COMES FROM</text>

  <g>
    <rect class="card" x="84" y="356" width="452" height="212" rx="10"/>
    <text class="mono green" x="116" y="396" font-size="13" letter-spacing="2" font-weight="600">01 WARM</text>
    <text class="sans ink" x="116" y="428" font-size="20" font-weight="700">The model reads it once</text>
    <text class="sans soft" x="116" y="458" font-size="15.5">The whole document goes through the</text>
    <text class="sans soft" x="116" y="482" font-size="15.5">model one time. Its internal state — the</text>
    <text class="sans soft" x="116" y="506" font-size="15.5">KV cache — is written to a file on disk.</text>
    <text class="mono muted" x="116" y="544" font-size="13.5">slow once · minutes for a big doc</text>
  </g>
  <text class="sans muted" x="546" y="472" font-size="26">→</text>
  <g>
    <rect class="card" x="574" y="356" width="452" height="212" rx="10"/>
    <text class="mono green" x="606" y="396" font-size="13" letter-spacing="2" font-weight="600">02 ASK</text>
    <text class="sans ink" x="606" y="428" font-size="20" font-weight="700">Questions pay only for themselves</text>
    <text class="sans soft" x="606" y="458" font-size="15.5">Each query restores that state, so the</text>
    <text class="sans soft" x="606" y="482" font-size="15.5">model processes your question — tens of</text>
    <text class="sans soft" x="606" y="506" font-size="15.5">tokens — not the document again.</text>
    <text class="mono muted" x="606" y="544" font-size="13.5">evaluated 38 of 41,772 tokens</text>
  </g>
  <text class="sans muted" x="1036" y="472" font-size="26">→</text>
  <g>
    <rect class="card" x="1064" y="356" width="452" height="212" rx="10"/>
    <text class="mono green" x="1096" y="396" font-size="13" letter-spacing="2" font-weight="600">03 REBOOT</text>
    <text class="sans ink" x="1096" y="428" font-size="20" font-weight="700">The file outlives restarts</text>
    <text class="sans soft" x="1096" y="458" font-size="15.5">The state lives on disk, not in a session.</text>
    <text class="sans soft" x="1096" y="482" font-size="15.5">Tomorrow's first question costs the</text>
    <text class="sans soft" x="1096" y="506" font-size="15.5">same as today's last one.</text>
    <text class="mono muted" x="1096" y="544" font-size="13.5">no re-read · not tomorrow, not ever</text>
  </g>

  <!-- band B: the check -->
  <text class="mono muted" x="84" y="632" font-size="13" letter-spacing="2.6">B · THE CHECK — WHERE THE TRUST COMES FROM</text>

  <g>
    <rect class="card" x="84" y="652" width="360" height="152" rx="10"/>
    <text class="mono muted" x="112" y="688" font-size="12" letter-spacing="1.8">A CLAIM — YOURS, OR ANOTHER AI'S</text>
    <text class="sans ink" x="112" y="726" font-size="18" font-style="italic">"Widgets are refundable</text>
    <text class="sans ink" x="112" y="754" font-size="18" font-style="italic">within 30 days."</text>
  </g>
  <text class="sans muted" x="456" y="736" font-size="26">→</text>
  <g>
    <rect class="card" x="492" y="652" width="430" height="152" rx="10"/>
    <text class="mono muted" x="520" y="688" font-size="12" letter-spacing="1.8">THE MODEL RULES ON IT…</text>
    <rect x="520" y="704" width="106" height="32" rx="16" fill="#E4EDE7"/>
    <text class="mono green" x="573" y="725" font-size="13.5" text-anchor="middle">supported</text>
    <rect x="636" y="704" width="130" height="32" rx="16" fill="#F4E4D9"/>
    <text class="mono" fill="#B4531F" x="701" y="725" font-size="13.5" text-anchor="middle">contradicted</text>
    <rect x="776" y="704" width="86" height="32" rx="16" fill="#E9EBE7"/>
    <text class="mono muted" x="819" y="725" font-size="13.5" text-anchor="middle">absent</text>
    <text class="sans soft" x="520" y="774" font-size="15.5">…and must cite the exact passage.</text>
  </g>
  <text class="sans muted" x="934" y="736" font-size="26">→</text>
  <g>
    <rect class="card" x="970" y="652" width="546" height="152" rx="10"/>
    <text class="mono muted" x="998" y="688" font-size="12" letter-spacing="1.8">…THEN A PLAIN STRING SEARCH</text>
    <text class="sans soft" x="998" y="720" font-size="16">The quoted passage is looked up in the source —</text>
    <text class="sans soft" x="998" y="744" font-size="16">like Ctrl+F. No second model, no opinion. A</text>
    <text class="sans soft" x="998" y="768" font-size="16">fabricated quote simply isn't there.</text>
  </g>

  <!-- limits + stamps -->
  <text class="sans muted" x="84" y="856" font-size="15">Honest limits: the search proves the quote exists, not that it settles the claim; "absent" verdicts get a</text>
  <text class="sans muted" x="84" y="882" font-size="15">vocabulary-overlap probe instead. Fail-safe: only supported + found is trusted — the rest goes to a human.</text>

  <g transform="rotate(-3 1130 862)">
    <rect x="985" y="836" width="290" height="52" rx="8" fill="none" stroke="#1E6B4F" stroke-width="2.5"/>
    <text class="mono green" x="1130" y="869" font-size="15" letter-spacing="1.6" font-weight="700" text-anchor="middle">QUOTE FOUND · VERIFIED</text>
  </g>
  <g transform="rotate(2 1400 878)">
    <rect x="1255" y="852" width="290" height="52" rx="8" fill="none" stroke="#B4531F" stroke-width="2.5"/>
    <text class="mono" fill="#B4531F" x="1400" y="885" font-size="15" letter-spacing="1.6" font-weight="700" text-anchor="middle">NOT IN SOURCE · FLAGGED</text>
  </g>

  <!-- footer -->
  <text class="mono muted" x="84" y="952" font-size="12.5">github.com/VictorSteinbock/llama-cag-n8n-reworked</text>
  <text class="mono muted" x="1516" y="952" font-size="12.5" text-anchor="end">POST /query · POST /verify · calibration battery included</text>
</svg>
