<svg viewBox="0 0 1250 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <!-- dotted n8n-canvas hint -->
    <pattern id="vwCanvas" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1E293B"/>
    </pattern>
    <radialGradient id="vwGlowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vwGlowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <marker id="vwArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vwArrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#34D399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vwArrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#F87171" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1250" height="420" fill="#0F172A"/>
  <rect x="0" y="0" width="1250" height="420" fill="url(#vwCanvas)"/>
  <ellipse cx="240" cy="150" rx="260" ry="150" fill="url(#vwGlowGreen)"/>
  <ellipse cx="1000" cy="270" rx="280" ry="160" fill="url(#vwGlowAmber)"/>

  <!-- title -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#E2E8F0">Claim verification — <tspan fill="#22D3EE">POST /webhook/cag/verify</tspan></text>
  <text x="40" y="70" font-size="14" fill="#94A3B8">One warm document, a list of claims — each checked at temperature 0, one failure captured without aborting the batch.</text>

  <!-- ============ connection lines (drawn under nodes) ============ -->
  <!-- Webhook -> Split -->
  <path d="M232 150 L268 150" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#vwArrow)"/>
  <!-- Split -> HTTP verify -->
  <path d="M420 150 L456 150" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#vwArrow)"/>
  <!-- HTTP verify OUTPUT 0 -> Collect Verdict (up) -->
  <path d="M632 138 C 676 118 676 92 720 92" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#vwArrowGreen)"/>
  <!-- HTTP verify OUTPUT 1 (error) -> Mark Failure (down, red dashed) -->
  <path d="M632 162 C 676 206 676 232 720 232" fill="none" stroke="#F87171" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#vwArrowRed)"/>
  <!-- Collect Verdict -> Aggregate (down to center) -->
  <path d="M884 92 C 928 92 928 150 972 150" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#vwArrowGreen)"/>
  <!-- Mark Failure -> Aggregate (up to center, red dashed) -->
  <path d="M884 232 C 928 232 928 174 972 162" fill="none" stroke="#F87171" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#vwArrowRed)"/>

  <!-- branch labels -->
  <rect x="648" y="70" width="52" height="19" rx="9.5" fill="#0F172A"/>
  <text x="674" y="84" font-size="12" fill="#34D399" text-anchor="middle">success</text>
  <rect x="648" y="246" width="46" height="19" rx="9.5" fill="#0F172A"/>
  <text x="671" y="260" font-size="12" fill="#F87171" text-anchor="middle">on error</text>

  <!-- respond arrow drawn after aggregate below -->
  <path d="M1090 150 L1116 150" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#vwArrow)"/>

  <!-- ============ NODES ============ -->

  <!-- Verify Webhook -->
  <g>
    <rect x="104" y="120" width="128" height="60" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-width="1.75"/>
    <circle cx="130" cy="150" r="13" fill="#0E2830" stroke="#22D3EE" stroke-width="1.5"/>
    <path d="M124 150 h12 M130 144 v12" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round"/>
    <text x="150" y="146" font-size="13" font-weight="700" fill="#E2E8F0">Verify</text>
    <text x="150" y="163" font-size="13" font-weight="700" fill="#E2E8F0">Webhook</text>
  </g>
  <text x="168" y="199" font-size="11" fill="#64748B" text-anchor="middle">webhook</text>

  <!-- Split Claims -->
  <g>
    <rect x="292" y="120" width="128" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(318 150)">
      <path d="M-7 -6 h14 M-7 0 h14 M-7 6 h10" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <text x="338" y="146" font-size="13" font-weight="700" fill="#E2E8F0">Split</text>
    <text x="338" y="163" font-size="13" font-weight="700" fill="#E2E8F0">Claims</text>
  </g>
  <text x="356" y="199" font-size="11" fill="#64748B" text-anchor="middle">splitOut · body.claims</text>

  <!-- Verify Against CAG API (has two outputs) -->
  <g>
    <rect x="480" y="118" width="152" height="64" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.75"/>
    <g transform="translate(508 150)">
      <path d="M-8 -5 a8 8 0 1 0 3 -6" fill="none" stroke="#F59E0B" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M-5 -11 l0 6 l6 0" fill="none" stroke="#F59E0B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="528" y="141" font-size="13" font-weight="700" fill="#E2E8F0">Verify Against</text>
    <text x="528" y="158" font-size="13" font-weight="700" fill="#E2E8F0">CAG API</text>
    <text x="528" y="173" font-size="11" fill="#94A3B8">POST /query</text>
    <!-- output ports -->
    <circle cx="632" cy="138" r="3.5" fill="#34D399"/>
    <circle cx="632" cy="162" r="3.5" fill="#F87171"/>
  </g>
  <text x="556" y="201" font-size="11" fill="#64748B" text-anchor="middle">httpRequest · temperature 0 · json_schema</text>

  <!-- Collect Verdict -->
  <g>
    <rect x="720" y="62" width="164" height="60" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
    <g transform="translate(746 92)">
      <path d="M-7 0 l4 5 l8 -10" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="766" y="88" font-size="13" font-weight="700" fill="#E2E8F0">Collect Verdict</text>
    <text x="766" y="106" font-size="11" fill="#94A3B8">{claim, verdict, quote}</text>
  </g>
  <text x="802" y="42" font-size="11" fill="#64748B" text-anchor="middle">set</text>

  <!-- Mark Failure -->
  <g>
    <rect x="720" y="202" width="164" height="60" rx="12" fill="#1E293B" stroke="#F87171" stroke-width="1.5"/>
    <g transform="translate(746 232)">
      <path d="M0 -7 v6 M0 3 v1.5" stroke="#F87171" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="8.5" fill="none" stroke="#F87171" stroke-width="1.6"/>
    </g>
    <text x="766" y="228" font-size="13" font-weight="700" fill="#E2E8F0">Mark Failure</text>
    <text x="766" y="246" font-size="11" fill="#94A3B8">captures the error</text>
  </g>
  <text x="802" y="282" font-size="11" fill="#64748B" text-anchor="middle">set</text>

  <!-- Aggregate Verdicts -->
  <g>
    <rect x="972" y="120" width="118" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(996 150)">
      <rect x="-7" y="-7" width="14" height="4" rx="1.5" fill="#94A3B8"/>
      <rect x="-7" y="-1" width="14" height="4" rx="1.5" fill="#94A3B8"/>
      <rect x="-7" y="5" width="9" height="4" rx="1.5" fill="#94A3B8"/>
    </g>
    <text x="1016" y="146" font-size="13" font-weight="700" fill="#E2E8F0">Aggregate</text>
    <text x="1016" y="163" font-size="13" font-weight="700" fill="#E2E8F0">Verdicts</text>
  </g>
  <text x="1031" y="199" font-size="11" fill="#64748B" text-anchor="middle">aggregate</text>

  <!-- Respond With Verdicts -->
  <g>
    <rect x="1116" y="120" width="80" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(1138 150)">
      <path d="M6 -6 l-10 6 l10 6" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1160" y="147" font-size="12" font-weight="700" fill="#E2E8F0">Respond</text>
    <text x="1160" y="163" font-size="11" fill="#94A3B8">JSON</text>
  </g>

  <!-- footer -->
  <text x="40" y="404" font-size="12.5" fill="#64748B">Response: an array of <tspan fill="#94A3B8">{claim, verdict, quote, cache_source, error}</tspan> — mirrors n8n/workflows/claim-verification-workflow.json</text>
</svg>
