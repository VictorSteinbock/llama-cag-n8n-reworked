<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>llama-cag-n8n pitch deck, page 3 of 3: the fact-checker — how a claim reaches it and in what form, the three things that come back, and the loop it creates for agents: draft, check against the trusted document, pass or hold back, memory stays checked.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B766E"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E6B4F"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Segoe UI Variable Text", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
    .ink { fill: #1F2A24; } .muted { fill: #5B665F; } .soft { fill: #3D4842; }
    .green { fill: #1E6B4F; }
    .hair { stroke: #D9DDD6; stroke-width: 1; }
    .card { fill: #FFFFFF; stroke: #D9DDD6; }
    .chip { fill: #F2F3EF; stroke: #DDE1DA; }
    .flow { stroke: #8A948C; stroke-width: 2; fill: none; }
    .flowg { stroke: #1E6B4F; stroke-width: 2.2; fill: none; }
  </style>

  <rect x="0" y="0" width="1600" height="1000" fill="#F2F3EF"/>

  <!-- folio -->
  <text class="mono muted" x="84" y="58" font-size="12" letter-spacing="2.2">LLAMA-CAG-N8N · A SELF-HOSTED DOCUMENT-MEMORY &amp; VERIFICATION STACK</text>
  <text class="mono muted" x="1516" y="58" font-size="12" letter-spacing="2.2" text-anchor="end">03 / 03</text>
  <line class="hair" x1="84" y1="78" x2="1516" y2="78"/>

  <!-- headline -->
  <text class="mono green" x="84" y="148" font-size="14" letter-spacing="3.4" font-weight="600">THE PART I CARE MOST ABOUT</text>
  <text class="sans ink" x="82" y="212" font-size="44" font-weight="700" letter-spacing="-0.4">A fact-checker your other AIs can use.</text>
  <text class="sans soft" x="84" y="252" font-size="17">Any AI can sound confident. This adds a way to ask — does the trusted document actually say that? —</text>
  <text class="sans soft" x="84" y="278" font-size="17">and a way to make agents ask it automatically, every time. Simplified below, on purpose.</text>

  <!-- left: how a claim reaches it -->
  <text class="mono muted" x="84" y="322" font-size="13" letter-spacing="2.6">HOW A CLAIM REACHES IT, AND IN WHAT FORM</text>

  <g>
    <rect class="card" x="84" y="338" width="620" height="146" rx="10"/>
    <text class="sans ink" x="112" y="370" font-size="16.5" font-weight="700">A claim shows up</text>
    <text class="sans soft" x="112" y="396" font-size="14">In a draft answer, or as something an agent is about to</text>
    <text class="sans soft" x="112" y="417" font-size="14">save to its memory. It travels as a small note:</text>
    <rect class="chip" x="112" y="432" width="420" height="36" rx="8"/>
    <text class="mono ink" x="128" y="456" font-size="13">{ "claim": "refunds allowed within 30 days" }</text>
  </g>
  <line class="flow" x1="394" y1="484" x2="394" y2="506" marker-end="url(#ah)"/>
  <g>
    <rect class="card" x="84" y="510" width="620" height="112" rx="10"/>
    <text class="sans ink" x="112" y="542" font-size="16.5" font-weight="700">It's posted to the checker</text>
    <text class="sans soft" x="112" y="568" font-size="14">As that same note — through the agent tool (MCP), or a plain</text>
    <text class="sans soft" x="112" y="589" font-size="14">local web address (an n8n webhook any bot or script can call).</text>
  </g>
  <line class="flow" x1="394" y1="622" x2="394" y2="644" marker-end="url(#ah)"/>
  <g>
    <rect class="card" x="84" y="648" width="620" height="216" rx="10"/>
    <text class="sans ink" x="112" y="680" font-size="16.5" font-weight="700">Three things come back</text>
    <circle cx="119" cy="708" r="4.5" fill="#1E6B4F"/>
    <text class="sans soft" x="136" y="714" font-size="14.5">a verdict — supported · contradicted · not in the document</text>
    <circle cx="119" cy="744" r="4.5" fill="#5B665F"/>
    <text class="sans soft" x="136" y="750" font-size="14.5">the exact passage the verdict points to</text>
    <circle cx="119" cy="780" r="4.5" fill="#B4531F"/>
    <text class="sans soft" x="136" y="786" font-size="14.5">and a yes/no: does that passage really appear in the</text>
    <text class="sans soft" x="136" y="808" font-size="14.5">document? — a plain text search, not another AI's opinion.</text>
    <text class="mono muted" x="112" y="842" font-size="12.5">a made-up quote fails the search — that's the trap it can't slip</text>
  </g>

  <!-- right: the loop -->
  <text class="mono muted" x="744" y="322" font-size="13" letter-spacing="2.6">THE LOOP IT CREATES</text>

  <g>
    <rect class="card" x="1000" y="340" width="330" height="96" rx="10"/>
    <text class="mono green" x="1024" y="370" font-size="12.5" letter-spacing="1.8" font-weight="600">THE AGENT</text>
    <text class="sans soft" x="1024" y="396" font-size="14">drafts an answer — or wants to</text>
    <text class="sans soft" x="1024" y="417" font-size="14">remember a new "fact"</text>
  </g>
  <g>
    <rect class="card" x="1256" y="520" width="260" height="108" rx="10"/>
    <text class="mono green" x="1280" y="550" font-size="12.5" letter-spacing="1.8" font-weight="600">THE GATE</text>
    <text class="sans soft" x="1280" y="576" font-size="14">checks it against the</text>
    <text class="sans soft" x="1280" y="597" font-size="14">trusted document</text>
  </g>
  <g>
    <rect class="card" x="1000" y="712" width="330" height="118" rx="10"/>
    <text class="mono green" x="1024" y="742" font-size="12.5" letter-spacing="1.8" font-weight="600">THE OUTCOME</text>
    <circle cx="1031" cy="768" r="4.5" fill="#1E6B4F"/>
    <text class="sans soft" x="1048" y="774" font-size="14">passes → it goes through, gets stored</text>
    <circle cx="1031" cy="800" r="4.5" fill="#B4531F"/>
    <text class="sans soft" x="1048" y="806" font-size="14">doesn't → held back for a person</text>
  </g>
  <g>
    <rect class="card" x="744" y="520" width="252" height="108" rx="10"/>
    <text class="mono green" x="768" y="550" font-size="12.5" letter-spacing="1.8" font-weight="600">THE MEMORY</text>
    <text class="sans soft" x="768" y="576" font-size="14">only checked things pile</text>
    <text class="sans soft" x="768" y="597" font-size="14">up — errors don't compound</text>
  </g>

  <path class="flow" d="M 1290 440 Q 1396 462 1386 512" marker-end="url(#ah)"/>
  <path class="flow" d="M 1386 632 Q 1400 700 1302 712" marker-end="url(#ah)"/>
  <path class="flow" d="M 996 772 Q 858 766 866 632" marker-end="url(#ah)"/>
  <path class="flowg" d="M 866 516 Q 858 408 992 388" marker-end="url(#ahg)"/>

  <text class="mono muted" x="1126" y="570" font-size="12.5" text-anchor="middle">checked things in</text>
  <text class="mono muted" x="1126" y="592" font-size="12.5" text-anchor="middle">unchecked things out</text>

  <!-- honesty -->
  <line class="hair" x1="84" y1="884" x2="1516" y2="884"/>
  <text class="sans muted" x="84" y="914" font-size="14.5">Honestly: the text search proves the quoted passage exists — not that it settles every claim. Anything unclear leaves the loop, to a person.</text>

  <!-- footer -->
  <line class="hair" x1="84" y1="928" x2="1516" y2="928"/>
  <text class="mono muted" x="84" y="960" font-size="12.5">github.com/VictorSteinbock/llama-cag-n8n-reworked</text>
  <text class="mono muted" x="1516" y="960" font-size="12.5" text-anchor="end">early, one-person project — feedback very welcome</text>
</svg>
