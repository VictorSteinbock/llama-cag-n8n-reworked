<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>llama-cag-n8n pitch deck, page 2 of 3: follow one question through the machine. It becomes a small note, enters through one of three doors, the librarian loads the saved reading, the reader answers, and the answer walks back with its provenance. Four small services, all local.</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B766E"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Segoe UI Variable Text", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; }
    .ink { fill: #1F2A24; } .muted { fill: #5B665F; } .soft { fill: #3D4842; }
    .green { fill: #1E6B4F; }
    .hair { stroke: #D9DDD6; stroke-width: 1; }
    .card { fill: #FFFFFF; stroke: #D9DDD6; }
    .chip { fill: #F2F3EF; stroke: #DDE1DA; }
    .flow { stroke: #8A948C; stroke-width: 2; fill: none; }
  </style>

  <rect x="0" y="0" width="1600" height="1000" fill="#F2F3EF"/>

  <!-- folio -->
  <text class="mono muted" x="84" y="58" font-size="12" letter-spacing="2.2">LLAMA-CAG-N8N · A SELF-HOSTED DOCUMENT-MEMORY &amp; VERIFICATION STACK</text>
  <text class="mono muted" x="1516" y="58" font-size="12" letter-spacing="2.2" text-anchor="end">02 / 03</text>
  <line class="hair" x1="84" y1="78" x2="1516" y2="78"/>

  <!-- headline -->
  <text class="mono green" x="84" y="148" font-size="14" letter-spacing="3.4" font-weight="600">FOLLOW ONE QUESTION THROUGH THE MACHINE</text>
  <text class="sans ink" x="82" y="212" font-size="44" font-weight="700" letter-spacing="-0.4">Where your question actually goes.</text>
  <text class="sans muted" x="84" y="252" font-size="15.5" font-style="italic">Simplified on purpose: this is the shape of what happens, not every wire. Everything below runs in</text>
  <text class="sans muted" x="84" y="276" font-size="15.5" font-style="italic">Docker containers on one machine, talking to each other on localhost. Nothing calls the internet.</text>

  <!-- row 1 -->
  <g>
    <rect class="card" x="84" y="304" width="452" height="192" rx="10"/>
    <text class="mono green" x="112" y="336" font-size="12.5" letter-spacing="1.8" font-weight="600">STEP 01</text>
    <text class="sans ink" x="112" y="363" font-size="17.5" font-weight="700">A question becomes a note</text>
    <text class="sans soft" x="112" y="390" font-size="14">You type it in the web page, a chat bot forwards</text>
    <text class="sans soft" x="112" y="411" font-size="14">it, or your coding agent asks on its own. Either</text>
    <text class="sans soft" x="112" y="432" font-size="14">way it becomes a small note like this:</text>
    <rect class="chip" x="112" y="446" width="396" height="36" rx="8"/>
    <text class="mono ink" x="128" y="470" font-size="13">{ "question": "…", "document": 3 }</text>
  </g>
  <line class="flow" x1="544" y1="400" x2="566" y2="400" marker-end="url(#ah)"/>
  <g>
    <rect class="card" x="574" y="304" width="452" height="192" rx="10"/>
    <text class="mono green" x="602" y="336" font-size="12.5" letter-spacing="1.8" font-weight="600">STEP 02</text>
    <text class="sans ink" x="602" y="363" font-size="17.5" font-weight="700">Three doors, one desk</text>
    <text class="sans soft" x="602" y="390" font-size="14">The note arrives through the web page, the agent</text>
    <text class="sans soft" x="602" y="411" font-size="14">tool (MCP), or an n8n webhook. n8n is automation</text>
    <text class="sans soft" x="602" y="432" font-size="14">glue; a "workflow" is just a recipe: when a note</text>
    <text class="sans soft" x="602" y="453" font-size="14">hits this local address, do these steps.</text>
    <text class="mono muted" x="602" y="480" font-size="12.5">all three doors lead to the same desk</text>
  </g>
  <line class="flow" x1="1034" y1="400" x2="1056" y2="400" marker-end="url(#ah)"/>
  <g>
    <rect class="card" x="1064" y="304" width="452" height="192" rx="10"/>
    <text class="mono green" x="1092" y="336" font-size="12.5" letter-spacing="1.8" font-weight="600">STEP 03</text>
    <text class="sans ink" x="1092" y="363" font-size="17.5" font-weight="700">The librarian checks the shelf</text>
    <text class="sans soft" x="1092" y="390" font-size="14">cag-api finds the document you mean and makes</text>
    <text class="sans soft" x="1092" y="411" font-size="14">sure the model's saved reading of it is loaded,</text>
    <text class="sans soft" x="1092" y="432" font-size="14">from disk into memory, if it isn't already.</text>
    <rect class="chip" x="1092" y="446" width="240" height="34" rx="17"/>
    <text class="mono muted" x="1212" y="468" font-size="12.5" text-anchor="middle">resource: disk → RAM</text>
  </g>

  <!-- turn -->
  <line class="flow" x1="1290" y1="496" x2="1290" y2="540" marker-end="url(#ah)"/>

  <!-- row 2 (right to left) -->
  <g>
    <rect class="card" x="1064" y="548" width="452" height="192" rx="10"/>
    <text class="mono green" x="1092" y="580" font-size="12.5" letter-spacing="1.8" font-weight="600">STEP 04</text>
    <text class="sans ink" x="1092" y="607" font-size="17.5" font-weight="700">The reader answers</text>
    <text class="sans soft" x="1092" y="634" font-size="14">llama.cpp, the model running on your machine,</text>
    <text class="sans soft" x="1092" y="655" font-size="14">answers from its saved reading. The only new work</text>
    <text class="sans soft" x="1092" y="676" font-size="14">it does is your question, not the document.</text>
    <rect class="chip" x="1092" y="690" width="290" height="34" rx="17"/>
    <text class="mono muted" x="1237" y="712" font-size="12.5" text-anchor="middle">resource: your CPU · no internet</text>
  </g>
  <line class="flow" x1="1056" y1="644" x2="1034" y2="644" marker-end="url(#ah)"/>
  <g>
    <rect class="card" x="574" y="548" width="452" height="192" rx="10"/>
    <text class="mono green" x="602" y="580" font-size="12.5" letter-spacing="1.8" font-weight="600">STEP 05</text>
    <text class="sans ink" x="602" y="607" font-size="17.5" font-weight="700">The answer walks back</text>
    <text class="sans soft" x="602" y="634" font-size="14">Same path in reverse, with a small note attached:</text>
    <text class="sans soft" x="602" y="655" font-size="14">which document answered, and whether its memory</text>
    <text class="sans soft" x="602" y="676" font-size="14">came from RAM or had to be fetched from disk.</text>
    <rect class="chip" x="602" y="690" width="330" height="34" rx="17"/>
    <text class="mono muted" x="767" y="712" font-size="12.5" text-anchor="middle">the exchange is logged (Postgres)</text>
  </g>
  <line class="flow" x1="566" y1="644" x2="544" y2="644" marker-end="url(#ah)"/>
  <g>
    <rect class="card" x="84" y="548" width="452" height="192" rx="10"/>
    <text class="mono green" x="112" y="580" font-size="12.5" letter-spacing="1.8" font-weight="600">DONE</text>
    <text class="sans ink" x="112" y="607" font-size="17.5" font-weight="700">Back to you, or your agent</text>
    <text class="sans soft" x="112" y="634" font-size="14">The asker gets the answer plus that provenance</text>
    <text class="sans soft" x="112" y="655" font-size="14">note. The document was not re-read, and nothing</text>
    <text class="sans soft" x="112" y="676" font-size="14">left the machine.</text>
    <text class="mono green" x="112" y="712" font-size="12.5" letter-spacing="1.4">ready for the next question →</text>
  </g>

  <!-- what's running -->
  <text class="mono muted" x="84" y="790" font-size="13" letter-spacing="2.6">WHAT'S ACTUALLY RUNNING · FOUR SMALL SERVICES, ALL DOCKER, ALL LOCALHOST</text>
  <g>
    <rect class="card" x="84" y="806" width="340" height="88" rx="10"/>
    <text class="mono ink" x="108" y="840" font-size="14.5" font-weight="700">n8n</text>
    <text class="sans muted" x="108" y="866" font-size="13">the receptionist: automation recipes</text>
    <rect class="card" x="448" y="806" width="340" height="88" rx="10"/>
    <text class="mono ink" x="472" y="840" font-size="14.5" font-weight="700">cag-api</text>
    <text class="sans muted" x="472" y="866" font-size="13">the librarian: catalog, desk, decisions</text>
    <rect class="card" x="812" y="806" width="340" height="88" rx="10"/>
    <text class="mono ink" x="836" y="840" font-size="14.5" font-weight="700">llama.cpp</text>
    <text class="sans muted" x="836" y="866" font-size="13">the reader: the AI model itself</text>
    <rect class="card" x="1176" y="806" width="340" height="88" rx="10"/>
    <text class="mono ink" x="1200" y="840" font-size="14.5" font-weight="700">Postgres</text>
    <text class="sans muted" x="1200" y="866" font-size="13">the logbook: what exists, what was asked</text>
  </g>

  <!-- footer -->
  <line class="hair" x1="84" y1="928" x2="1516" y2="928"/>
  <text class="mono muted" x="84" y="960" font-size="12.5">github.com/VictorSteinbock/llama-cag-n8n-reworked</text>
  <text class="mono muted" x="1516" y="960" font-size="12.5" text-anchor="end">MIT · runs on your machine · offline after setup</text>
</svg>
