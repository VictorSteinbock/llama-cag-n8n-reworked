[project]
name = "cag-api"
version = "2.0.0"
description = "CAG orchestrator: document registry + llama-server KV cache slot management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Ship the static web UI (F9) in the wheel/editable install — packages.find
# collects .py only, so the .html asset needs an explicit entry or the
# StaticFiles mount would silently find no directory.
[tool.setuptools.package-data]
app = ["webui/*.html"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
